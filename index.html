<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>가평 샤이니 스파 펜션 - 홈</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="가평 샤이니 스파 펜션 - 홈" />
  <meta property="og:description" content="남이섬,가평레일바이크 인근에 위치한 가평스파펜션 샤이니입니다. 스파, 개별바베큐, 야외수영장을 즐기며 커플,가족과 함께 즐거운 시간 보내세요!" />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/06/05/FwLPGS36c4x9.jpg" />
  <meta property="og:url" content="https://shinyps.com" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="가평 샤이니 스파 펜션 - 홈" />
  <meta name="twitter:description" content="남이섬,가평레일바이크 인근에 위치한 가평스파펜션 샤이니입니다. 스파, 개별바베큐, 야외수영장을 즐기며 커플,가족과 함께 즐거운 시간 보내세요!" />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/06/05/FwLPGS36c4x9.jpg" />
  <meta name="naver-site-verification" content="77cb3ff3a348e78c07ce3ae1966d7152e1cc7aae" />
  <meta name="google-site-verification" content="g0u96ycOGf7GthP5-x4TPzMdLGA0zCkIwSGIA1ZHyrw" />
</head>

  <body>
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="main">
          <div class="main_visual visual">
            <div class="main_visual_box">
              <!-- data-* 속성 : data-index-hero-logo
                   index.essence.images[isSelected][0] — 원본 히어로 가운데 로고(.visual_img, windmillhill title.png)
                   B형은 essence 의 제목·설명만 쓰고 이미지 칸이 비어 있어 히어로 로고 칸으로 빌린다 (A형과 같은 방식).
                   이미지가 없으면 hidden 그대로라 지금처럼 이미지 전용 히어로다. <img> 는 매퍼가 만든다 (src="" 금지) -->
              <div class="visual_img hero_logo" data-index-hero-logo hidden></div>
              <div class="swiper-container">
                <div class="swiper-wrapper" data-index-hero-slides></div>
                <div class="swiper-button-prev"><img src="images/arrow_left.png" alt="prev" /></div>
                <div class="swiper-button-next"><img src="images/arrow_right.png" alt="next" /></div>
              </div>
            </div>
          </div>

          <div class="main_room">
            <div class="room_list">
              <div class="main_title sub_inner">
                <span data-index-eyebrow>WELCOME TO PENSION</span>
                <h3 data-index-room-title>Room Preview</h3>
                <p data-index-room-description></p>
              </div>
              <div class="room_sld_wrap">
                <div class="swiper-container room_list_sld">
                  <div class="swiper-wrapper" data-index-room-slides></div>
                </div>
              </div>
            </div>
          </div>

          <div class="main_bnr">
            <div class="box">
              <div class="main_title">
                <h3 data-index-memories-title>Memories</h3>
                <span data-index-eyebrow>WELCOME TO PENSION</span>
                <p data-index-memories-description>일상에서 벗어나 자연과 함께 즐기는 여유로운 시간</p>
              </div>
              <ul class="memories_img" data-index-memories-images></ul>
            </div>
            <div class="box bnr_sld">
              <strong data-index-landscape-title>Beautiful Healing Place</strong>
              <div class="spe_list">
                <div class="swiper-container">
                  <div class="swiper-wrapper" data-index-landscape-slides></div>
                  <div class="swiper-button-next" aria-label="다음">
                    <img src="images/arrow_right.png" alt="next" />
                  </div>
                  <div class="swiper-button-prev" aria-label="이전">
                    <img src="images/arrow_left.png" alt="prev" />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="main_special inner">
            <div class="main_title">
              <h3 data-index-special-title>SPECIAL</h3>
              <span data-index-eyebrow>WELCOME TO PENSION</span>
            </div>
            <ul data-index-special-list></ul>
          </div>
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/index-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/index.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
